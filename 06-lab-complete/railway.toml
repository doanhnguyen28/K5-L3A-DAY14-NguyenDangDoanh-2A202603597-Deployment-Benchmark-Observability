# Railway: `railway up` từ thư mục 06-lab-complete/
# Biến cần đặt trên Railway: AGENT_API_KEY, REDIS_URL (=${{Redis.REDIS_URL}}), ENVIRONMENT=production
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
